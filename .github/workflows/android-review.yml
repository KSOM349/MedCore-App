# To enable, copy this file to .github/workflows/android-review.yml on GitHub.
# The connected authorization can edit application code, but not workflow files.
name: Android review build
on:
  push:
    branches: [agent/medcore-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK used by the existing project
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Compile, test and lint
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MedCore-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MedCore-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
